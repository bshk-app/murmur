appId: app.bshk.murmur.uitesthost
name: Editing saves changed text and returns to note
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
      uiFixture: true
- tapOn:
    id: skip-setup
- tapOn:
    id: note-.*
- tapOn:
    id: edit-note
- tapOn:
    id: note-editor
- eraseText
- inputText: Updated idea for tomorrow
- tapOn:
    id: save-note
- assertVisible: Updated idea for tomorrow
- assertNotVisible:
    id: note-editor
- takeScreenshot: edited-note
