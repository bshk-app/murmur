appId: app.bshk.murmur.uitesthost
name: One share action on a note
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
      uiFixture: true
- tapOn:
    id: skip-setup
- tapOn:
    id: note-.*
- assertVisible:
    id: share-note
- assertNotVisible: Send to Apple Notes
- assertVisible:
    id: copy-note
- takeScreenshot: one-share-action
