appId: app.bshk.murmur.uitesthost
name: System back gesture returns through each navigation level
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
      uiFixture: true
- tapOn:
    id: skip-setup
- tapOn:
    id: settings
- tapOn: Languages & offline
- assertVisible: Dictation languages
- swipe:
    start: "1%,50%"
    end: "95%,50%"
    duration: 500
- assertVisible: Speech
- assertNotVisible: Dictation languages
- swipe:
    start: "1%,50%"
    end: "95%,50%"
    duration: 500
- assertVisible:
    id: record-note
- tapOn:
    id: note-.*
- assertVisible:
    id: note-text
- swipe:
    start: "1%,45%"
    end: "95%,45%"
    duration: 500
- assertVisible:
    id: record-note
- assertNotVisible:
    id: note-text
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(en)"
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-next
- tapOn:
    id: onboarding-languages
- assertVisible: Dictation languages
- swipe:
    start: "1%,45%"
    end: "95%,45%"
    duration: 500
- assertVisible:
    id: onboarding-languages
- assertNotVisible:
    id: prepare-all-languages
