# Murmur release — thin caller of the shared zamok/ci pipeline.
# A tag `murmur-v1.2.3` (or a manual workflow_dispatch) builds → Developer-ID signs →
# notarizes → staples → zips → uploads the artifact as a GitHub release on
# bshk-app/murmur, and renders Casks/murmur.rb in bshk-app/homebrew-tap.
#
# Prereqs (see zamok/ci/README.md): this repo lives under the `zamok` Gitea org (org
# Tart runner + org secrets), and the canonical org secrets exist (Developer ID + notary
# + TAP_GITHUB_TOKEN) — passed through via `secrets: inherit`.
on:
  push: { tags: ["murmur-v*"] }
  workflow_dispatch:
    inputs: { version: { description: "e.g. 1.2.3", required: true } }
jobs:
  release:
    uses: zamok/ci/.gitea/workflows/macos-cask-release.yml@v1
    with:
      scheme: Murmur
      bundle-id: app.bshk.murmur
      cask-metadata: Distribution/cask-murmur.json
      asset-repo: bshk-app/murmur          # the app's own repo holds the artifact + appcast
      entitlements: Murmur.entitlements     # Hardened Runtime mic entitlement (de-risked §8.1)
      build-flags: ARCHS=arm64 ONLY_ACTIVE_ARCH=YES SWIFT_ENABLE_EXPLICIT_MODULES=NO
      # sparkle: true   # in-app update feed — enable once zamok/ci's generate_appcast
      #                  # step is implemented (Murmur is the first Sparkle app to do it).
      version: ${{ github.event.inputs.version }}
    secrets: inherit
