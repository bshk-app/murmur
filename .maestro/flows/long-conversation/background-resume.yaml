appId: app.bshk.murmur.ios
---
- openLink: murmur://languages
- scrollUntilVisible:
    centerElement: true
    element:
      text: 'Финский → Шведский'
    direction: DOWN
- takeScreenshot: after/download-returned-to-app
- extendedWaitUntil:
